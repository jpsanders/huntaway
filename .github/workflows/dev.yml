---
name: ci

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - '*'
  workflow_dispatch:

jobs:
  lint:
    uses: "./.github/workflows/python-checks.yml"
    with:
      python-version: "3.15"
    secrets:
      package-repo: ${{ secrets.PKG_REPOSITORY }}

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
        python-version: ["3.14", "3.15"]
    uses: "./.github/workflows/python-tests.yml"
    with:
      os: ${{ matrix.os }}
      python-version: ${{ matrix.python-version }}
    secrets:
      package-repo: ${{ secrets.PKG_REPOSITORY }}

  # Proves the built wheel installs on its own and runs, with no source tree around it.
  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: "Build the wheel and the sdist"
        run: |
          python -m pip install build
          python -m build -o dist

      - name: "Install the wheel in a clean environment and run it"
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp
          /tmp/clean/bin/huntaway --version
          /tmp/clean/bin/huntaway status --local --json > /dev/null
          /tmp/clean/bin/huntaway guide | head -3
          /tmp/clean/bin/huntaway doctor
